openapi: 3.1.1
info:
  title: KIIYA Cleaning Checker API
  version: 0.1.0-draft
  description: 実装前のAPI契約。未確定の判断はdocs/api-design.mdに記載。
servers:
  - url: https://api.example.invalid
    description: 配備時に環境ごとの実URLへ置換する
security:
  - googleIdToken: []
tags:
  - name: User
  - name: Master
  - name: Work
  - name: Report
  - name: Chatwork
  - name: Alerts
paths:
  /v1/me:
    get:
      tags: [User]
      operationId: getMe
      responses:
        '200':
          description: 現在の利用者
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/name-suggestions:
    get:
      tags: [User]
      operationId: listNameSuggestions
      parameters:
        - { name: query, in: query, schema: { type: string } }
      responses:
        '200':
          description: 全利用者で共有する氏名候補
          content:
            application/json:
              schema:
                type: object
                required: [names]
                properties:
                  names: { type: array, items: { type: string } }
  /v1/master-revisions/current:
    get:
      tags: [Master]
      operationId: getCurrentMasterRevision
      parameters:
        - { name: workDate, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: 指定作業日に有効なマスタ版。後日の通知確認で過去日の結果は変えない。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterRevision' }
  /v1/master-revisions/{revisionId}:
    get:
      tags: [Master]
      operationId: getMasterRevision
      parameters:
        - { $ref: '#/components/parameters/RevisionId' }
      responses:
        '200':
          description: 固定されたマスタ版
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterRevision' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/work-records:
    get:
      tags: [Work]
      operationId: listWorkRecords
      parameters:
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: 作業記録一覧。archived=trueは過去日付。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkSummary' } }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [Work]
      operationId: createWorkRecord
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkRecord' }
      responses:
        '201':
          description: 作業開始。masterRevisionIdを固定。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/work-records/{workId}:
    parameters:
      - { $ref: '#/components/parameters/WorkId' }
    get:
      tags: [Work]
      operationId: getWorkRecord
      description: 編集用。対象から外した箇所の保存済み結果も含む。
      responses:
        '200':
          description: 作業記録
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkRecord' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Work]
      operationId: updateWorkRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkRecord' }
      responses:
        '200':
          description: 保存後の作業記録
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/work-records/{workId}/history:
    get:
      tags: [Work]
      operationId: getWorkHistory
      parameters:
        - { $ref: '#/components/parameters/WorkId' }
      responses:
        '200':
          description: 表示対象の箇所のみ含む履歴
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkHistory' }
  /v1/work-records/{workId}/images:
    post:
      tags: [Work]
      operationId: addWorkImage
      description: 備考またはトラブルの画像を同期する。端末発行の画像IDを維持し、作業内容更新番号を進める。保存先キーは返さない。
      parameters:
        - { $ref: '#/components/parameters/WorkId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [revision, clientImageId, field, file]
              properties:
                revision: { type: integer, minimum: 1 }
                clientImageId: { type: string, format: uuid }
                field: { type: string, enum: [remarks, trouble] }
                file: { type: string, format: binary }
      responses:
        '201':
          description: 同期された画像と更新後の作業内容更新番号
          content:
            application/json:
              schema:
                type: object
                required: [image, revision]
                properties:
                  image: { $ref: '#/components/schemas/WorkImageAttachment' }
                  revision: { type: integer, minimum: 1 }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/work-records/{workId}/images/{imageId}:
    delete:
      tags: [Work]
      operationId: removeWorkImage
      description: 現在の作業から画像を除外する。過去の報告版の参照は残す。
      parameters:
        - { $ref: '#/components/parameters/WorkId' }
        - { $ref: '#/components/parameters/ImageId' }
        - { name: revision, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: 除外後の作業内容更新番号
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision: { type: integer, minimum: 1 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/work-records/{workId}/images/{imageId}/content:
    get:
      tags: [Work]
      operationId: getWorkImageContent
      description: 作業または保存中の報告版から参照される非公開画像を、閲覧権限確認後に返す。
      parameters:
        - { $ref: '#/components/parameters/WorkId' }
        - { $ref: '#/components/parameters/ImageId' }
      responses:
        '200':
          description: 保存した画像。Content-Typeは元画像の検証済みMIME形式。
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/work-records/{workId}/readiness:
    get:
      tags: [Work]
      operationId: getWorkReadiness
      parameters:
        - { $ref: '#/components/parameters/WorkId' }
      responses:
        '200':
          description: 報告可能かと不足項目。休憩のはい・いいえは回答済み、未回答は不足。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /v1/work-records/{workId}/report-button-press:
    post:
      tags: [Report]
      operationId: pressReportButton
      parameters:
        - { $ref: '#/components/parameters/WorkId' }
      responses:
        '200':
          description: 初回押下時刻。以後の押下では同じ値を返す。
          content:
            application/json:
              schema:
                type: object
                required: [firstReportButtonPressedAt, pastDateConfirmationRequired]
                properties:
                  firstReportButtonPressedAt: { type: string, format: date-time }
                  pastDateConfirmationRequired: { type: boolean }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/work-records/{workId}/report-preview:
    post:
      tags: [Report]
      operationId: createReportPreview
      description: 結果画面用の一時プレビュー。報告ボタン初回押下時刻、報告版、版番号を作らない。
      parameters:
        - { $ref: '#/components/parameters/WorkId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: { type: string, enum: [pdf, markdown] }
      responses:
        '200':
          description: 現在の作業内容に基づくプレビュー
          content:
            application/json:
              schema:
                type: object
                required: [sourceRevision, format, previewId, defaultEditableBody, imageIds]
                properties:
                  sourceRevision: { type: integer, minimum: 1 }
                  format: { type: string, enum: [pdf, markdown] }
                  previewId: { type: string }
                  defaultEditableBody: { type: string, description: 結果画面で利用者が編集できる送信本文の初期値 }
                  imageIds: { type: array, items: { type: string, format: uuid }, description: 現在有効な添付画像。版への固定は完了時に行う }
                  markdownText: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/report-previews/{previewId}/content:
    get:
      tags: [Report]
      operationId: getReportPreviewContent
      parameters:
        - { name: previewId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: PDFまたはMarkdownのプレビュー内容
          content:
            application/pdf:
              schema: { type: string, format: binary }
            text/markdown:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/work-records/{workId}/report-versions:
    get:
      tags: [Report]
      operationId: listReportVersions
      parameters:
        - { $ref: '#/components/parameters/WorkId' }
      responses:
        '200':
          description: 報告版一覧
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReportVersion' } }
    post:
      tags: [Report]
      operationId: submitReportVersion
      description: 確認ダイアログの「完了」に対応。作業更新番号と編集済み本文を受け取り、Sendingの版を初めて作る。202は投稿成功を意味しない。最新版がSendingまたはUnknownなら409。
      parameters:
        - { $ref: '#/components/parameters/WorkId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceRevision, confirmedBody, format, pastDateConfirmed]
              properties:
                sourceRevision: { type: integer, minimum: 1, description: プレビュー時の作業内容更新番号。現在値と異なれば409 }
                confirmedBody: { type: string, description: 利用者が結果画面で編集し、確認ダイアログで承認した本文。空文字を許す }
                format: { type: string, enum: [pdf, markdown] }
                pastDateConfirmed: { type: boolean }
      responses:
        '202':
          description: 本文・画像・作業内容を固定したSendingの報告版を作り、送信処理を開始
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/report-versions/{reportId}:
    get:
      tags: [Report]
      operationId: getReportVersion
      parameters:
        - { $ref: '#/components/parameters/ReportId' }
      responses:
        '200':
          description: 報告版と現在の送信結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportVersion' }
  /v1/report-versions/{reportId}/verification:
    post:
      tags: [Report]
      operationId: verifyReportDelivery
      description: 当日担当職員またはIT担当者が投稿の有無を確認し、確認者・日時・根拠を保存する。
      parameters:
        - { $ref: '#/components/parameters/ReportId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [posted, evidence]
              properties:
                posted: { type: boolean }
                evidence: { type: string, minLength: 1 }
                chatworkMessageId: { type: string }
      responses:
        '200':
          description: 確認結果を反映した版
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportVersion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/settings/chatwork:
    get:
      tags: [Chatwork]
      operationId: getChatworkSettings
      responses:
        '200':
          description: 秘密値を含まない設定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatworkSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Chatwork]
      operationId: putChatworkSettings
      description: IT担当者のみ。roomIdからルーム名を取得し確認する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, markdownDelivery]
              properties:
                roomId: { type: string, pattern: '^[0-9]+$' }
                markdownDelivery: { type: string, enum: [body, attachment] }
                reportTemplate: { type: string }
      responses:
        '200':
          description: 設定した唯一の送信先と取得したルーム名
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatworkSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/settings/chatwork/oauth/start:
    post:
      tags: [Chatwork]
      operationId: startChatworkOAuth
      responses:
        '200':
          description: 認可URL。stateとPKCE verifierはサーバー側で保持。
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/settings/chatwork/oauth/callback:
    get:
      tags: [Chatwork]
      operationId: finishChatworkOAuth
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '303':
          description: 接続結果を設定画面へリダイレクト。tokenはURLに含めない。
          headers:
            Location: { schema: { type: string, format: uri } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /v1/master-changes:
    post:
      tags: [Master]
      operationId: createMasterChange
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMasterChange' }
      responses:
        '201':
          description: 変更候補
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterChange' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/master-changes/{changeId}:
    get:
      tags: [Master]
      operationId: getMasterChange
      parameters:
        - { $ref: '#/components/parameters/ChangeId' }
      responses:
        '200':
          description: 変更状態と保存期間内の通知試行結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterChange' }
  /v1/master-changes/{changeId}/submit:
    post:
      tags: [Master]
      operationId: submitMasterChange
      parameters:
        - { $ref: '#/components/parameters/ChangeId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: 現在有効な元版と環境ごとの変更枠を確保して通知を開始。新版はまだ適用しない。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterChange' }
        '409':
          description: 元版が古い、または同じ環境で別の変更が通知中・適用待ち。通知は送らない。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterChangeConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/master-notification-evidence:
    get:
      tags: [Master]
      operationId: listLateNotificationEvidence
      description: IT担当者が不成立後に見つかった通知証拠を変更IDで照会する。元の変更記録が削除済みでも取得できる。
      parameters:
        - { name: changeId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: 保存期間内の証拠一覧
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LateNotificationEvidence' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Master]
      operationId: recordLateNotificationEvidence
      description: IT担当者がChatwork投稿を確認して登録する。同じ変更IDと投稿IDの重複登録を防ぎ、変更状態は変えない。
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLateNotificationEvidence' }
      responses:
        '201':
          description: 元の変更がChangeFailedと照合できた証拠
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LateNotificationEvidence' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/alerts:
    get:
      tags: [Alerts]
      operationId: listMyAlerts
      responses:
        '200':
          description: 自分宛のアラートのみ
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AppAlert' } }
  /v1/alerts/{alertId}/ack:
    post:
      tags: [Alerts]
      operationId: acknowledgeMyAlert
      parameters:
        - { name: alertId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 自分宛アラートの確認日時を記録
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppAlert' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    googleIdToken:
      type: http
      scheme: bearer
      bearerFormat: Google ID Token
  parameters:
    WorkId: { name: workId, in: path, required: true, schema: { type: string } }
    RevisionId: { name: revisionId, in: path, required: true, schema: { type: string } }
    ReportId: { name: reportId, in: path, required: true, schema: { type: string } }
    ChangeId: { name: changeId, in: path, required: true, schema: { type: string } }
    ImageId: { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
  responses:
    Unauthorized: { description: ログインが無効 }
    Forbidden: { description: 操作権限がない }
    NotFound: { description: 対象が存在しない、または閲覧権限がない }
    Conflict: { description: 更新番号・状態・冪等キーが競合 }
    ValidationError: { description: 入力内容または業務条件を満たさない }
    Unavailable: { description: 送信先またはサーバーが一時利用不可 }
  schemas:
    AppUser:
      type: object
      required: [id, displayName, roles]
      properties:
        id: { type: string }
        displayName: { type: string }
        roles: { type: array, items: { type: string, enum: [staff, it_admin] } }
    MasterRevision:
      type: object
      required: [id, effectiveDate, areas]
      properties:
        id: { type: string }
        effectiveDate: { type: string, format: date }
        notificationPostedAt: { type: [string, 'null'], format: date-time, description: Chatwork上の投稿日時 }
        notificationConfirmedAt: { type: [string, 'null'], format: date-time, description: 投稿成功を確認した日時 }
        areas:
          type: array
          items:
            type: object
            required: [code, name, alwaysSelected, hasDryer, checklistItems]
            properties:
              code: { type: string }
              name: { type: string }
              alwaysSelected: { type: boolean }
              hasDryer: { type: boolean }
              checklistItems: { type: array, items: { type: string } }
              capacity: { type: integer, minimum: 0 }
    WorkParticipant:
      type: object
      required: [id, name]
      description: IDはクライアントが作るUUID。同じ作業内で不変。氏名候補IDとは別。
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
    WorkImageAttachment:
      type: object
      required: [id, field, mediaType, byteSize, sha256, createdAt]
      description: 備考・トラブルに現在添付されている画像。非公開の保存先キーは返さない。
      properties:
        id: { type: string, format: uuid }
        field: { type: string, enum: [remarks, trouble] }
        mediaType: { type: string, pattern: '^image/' }
        byteSize: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdAt: { type: string, format: date-time }
    ReportImageSnapshot:
      type: object
      required: [imageId, field, mediaType, byteSize, sha256]
      description: 送信確定時の画像の固定参照。作業から除外しても報告版の保存期限中は閲覧可能。
      properties:
        imageId: { type: string, format: uuid }
        field: { type: string, enum: [remarks, trouble] }
        mediaType: { type: string, pattern: '^image/' }
        byteSize: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    CreateWorkRecord:
      type: object
      required: [workDate, onDutyEmployeeName, staffCount, participants]
      properties:
        workDate: { type: string, format: date }
        onDutyEmployeeName: { type: string, minLength: 1 }
        staffCount: { type: integer, minimum: 1, maximum: 5 }
        participants: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/WorkParticipant' } }
    WorkArea:
      type: object
      required: [code, selected, assigneeIds, checks]
      properties:
        code: { type: string }
        selected: { type: boolean }
        assigneeIds: { type: array, uniqueItems: true, items: { type: string, format: uuid }, description: 同じ作業の参加者IDだけを指定 }
        checks:
          type: object
          additionalProperties: { type: boolean }
        roomStay:
          type: object
          properties:
            guests: { type: integer, minimum: 0 }
            children: { type: integer, minimum: 0 }
            consecutiveStay: { type: boolean }
            exceptionNote: { type: string }
    WorkRecord:
      type: object
      required: [id, revision, workDate, masterRevisionId, status, hasSentReport, hasUnreportedChanges, onDutyEmployeeName, staffCount, participants, areas, images, breakTaken]
      properties:
        id: { type: string }
        revision: { type: integer, minimum: 1 }
        workDate: { type: string, format: date }
        masterRevisionId: { type: string }
        status: { type: string, enum: [Editing, Ready, Reporting, VerificationNeeded, Completed], description: Completedは送信済み実績。一度成立したら再報告が失敗しても戻さない }
        hasSentReport: { type: boolean, description: Sentの報告版が1件以上あるか }
        hasUnreportedChanges: { type: boolean, description: 最新の作業入力に対応する送信済み版がないか }
        latestReportVersionId: { type: [string, 'null'] }
        latestReportStatus: { type: [string, 'null'], enum: [Sending, Sent, Failed, Unknown, null] }
        firstCompletedAt: { type: [string, 'null'], format: date-time }
        onDutyEmployeeName: { type: string }
        staffCount: { type: integer, minimum: 1, maximum: 5 }
        participants: { type: array, items: { $ref: '#/components/schemas/WorkParticipant' } }
        areas: { type: array, items: { $ref: '#/components/schemas/WorkArea' } }
        images: { type: array, items: { $ref: '#/components/schemas/WorkImageAttachment' }, description: 現在の作業に添付されている画像。追加・除外は専用APIで行う }
        breakTaken: { type: [boolean, 'null'] }
        remarks: { type: string }
        trouble: { type: string }
        firstReportButtonPressedAt: { type: [string, 'null'], format: date-time }
        retentionHold: { type: boolean, description: 送信中・結果不明の版があり、期限後の削除を保留中 }
    UpdateWorkRecord:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
        onDutyEmployeeName: { type: string, minLength: 1 }
        staffCount: { type: integer, minimum: 1, maximum: 5 }
        participants: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/WorkParticipant' } }
        areas: { type: array, items: { $ref: '#/components/schemas/WorkArea' } }
        breakTaken: { type: [boolean, 'null'] }
        remarks: { type: string }
        trouble: { type: string }
    WorkSummary:
      type: object
      required: [id, workDate, status, hasSentReport, hasUnreportedChanges, archived]
      properties:
        id: { type: string }
        workDate: { type: string, format: date }
        status: { type: string, enum: [Editing, Ready, Reporting, VerificationNeeded, Completed] }
        hasSentReport: { type: boolean }
        hasUnreportedChanges: { type: boolean }
        latestReportVersionId: { type: [string, 'null'] }
        latestReportStatus: { type: [string, 'null'], enum: [Sending, Sent, Failed, Unknown, null] }
        archived: { type: boolean }
    WorkHistory:
      type: object
      required: [id, workDate, status, hasSentReport, hasUnreportedChanges, participants, areas, images, reportVersions]
      properties:
        id: { type: string }
        workDate: { type: string, format: date }
        status: { type: string, enum: [Editing, Ready, Reporting, VerificationNeeded, Completed] }
        hasSentReport: { type: boolean }
        hasUnreportedChanges: { type: boolean }
        latestReportVersionId: { type: [string, 'null'] }
        latestReportStatus: { type: [string, 'null'], enum: [Sending, Sent, Failed, Unknown, null] }
        participants: { type: array, items: { $ref: '#/components/schemas/WorkParticipant' } }
        areas: { type: array, items: { $ref: '#/components/schemas/WorkArea' } }
        images: { type: array, items: { $ref: '#/components/schemas/WorkImageAttachment' } }
        reportVersions: { type: array, items: { $ref: '#/components/schemas/ReportVersion' } }
    Readiness:
      type: object
      required: [ready, missing]
      properties:
        ready: { type: boolean }
        missing: { type: array, items: { type: string } }
    ReportVersion:
      type: object
      required: [id, workId, sequence, status, format, sourceRevision, confirmedBody, finalMessageBody, imagesSnapshot, createdAt, sendingStartedAt, sendingDeadlineAt]
      properties:
        id: { type: string }
        workId: { type: string }
        sequence: { type: integer, minimum: 1 }
        previousVersionId: { type: [string, 'null'] }
        status: { type: string, enum: [Sending, Sent, Failed, Unknown] }
        format: { type: string, enum: [pdf, markdown] }
        markdownDelivery: { type: [string, 'null'], enum: [body, attachment, null] }
        sourceRevision: { type: integer, minimum: 1 }
        confirmedBody: { type: [string, 'null'], description: 利用者が確認した編集済み本文。保存期限後に削除された版ではnull }
        finalMessageBody: { type: [string, 'null'], description: 報告ID・過去日付表示・生成報告内容を加えて確定したChatwork本文。保存期限後はnull }
        imagesSnapshot: { type: array, items: { $ref: '#/components/schemas/ReportImageSnapshot' }, description: 保存期限後に内容が削除された版では空配列 }
        createdAt: { type: string, format: date-time }
        sendingStartedAt: { type: string, format: date-time, description: 送信開始を永続化した時刻 }
        sendingDeadlineAt: { type: string, format: date-time, description: 送信開始から5分。期限時は投稿照合後に状態を確定する }
        sentAt: { type: [string, 'null'], format: date-time }
        chatworkMessageId: { type: [string, 'null'] }
        pastDate: { type: boolean }
        participantsSnapshot: { type: array, items: { $ref: '#/components/schemas/WorkParticipant' }, description: 送信確定時の参加者IDと氏名の写し }
        contentRetentionStatus: { type: string, enum: [indefinite, pendingVerification, untilDeadline, purged] }
    ChatworkSettings:
      type: object
      required: [connected, markdownDelivery]
      properties:
        connected: { type: boolean }
        postingAccountName: { type: [string, 'null'] }
        roomId: { type: [string, 'null'] }
        roomName: { type: [string, 'null'] }
        markdownDelivery: { type: string, enum: [body, attachment], default: body }
        reportTemplate: { type: string }
    CreateMasterChange:
      type: object
      required: [workId, baseRevisionId, candidate, onDutyEmployeeName, approvalDeclared, kiiyaApproverName, employeeApproverName]
      properties:
        workId: { type: string }
        baseRevisionId: { type: string }
        candidate: { $ref: '#/components/schemas/MasterCandidate' }
        onDutyEmployeeName: { type: string, minLength: 1 }
        approvalDeclared: { type: boolean, const: true }
        kiiyaApproverName: { type: string, minLength: 1 }
        employeeApproverName: { type: string, minLength: 1 }
    MasterCandidate:
      type: object
      required: [areas]
      description: 通知成功日と適用開始日をまだ持たない変更候補。
      properties:
        areas:
          type: array
          items:
            type: object
            required: [code, name, alwaysSelected, hasDryer, checklistItems]
            properties:
              code: { type: string }
              name: { type: string }
              alwaysSelected: { type: boolean }
              hasDryer: { type: boolean }
              checklistItems: { type: array, items: { type: string } }
              capacity: { type: integer, minimum: 0 }
    MasterChange:
      type: object
      required: [id, status, baseRevisionId, attempts]
      properties:
        id: { type: string }
        status: { type: string, enum: [Draft, Ready, AwaitingNotification, Scheduled, Applied, ChangeFailed] }
        baseRevisionId: { type: string }
        effectiveDate: { type: [string, 'null'], format: date }
        notificationPostedAt: { type: [string, 'null'], format: date-time }
        notificationConfirmedAt: { type: [string, 'null'], format: date-time }
        attempts:
          type: array
          items:
            type: object
            required: [number, result]
            properties:
              number: { type: integer, minimum: 1, maximum: 3 }
              result: { type: string, enum: [Pending, Sending, Sent, Failed, Unknown] }
              attemptedAt: { type: [string, 'null'], format: date-time }
    MasterChangeConflict:
      type: object
      required: [code, currentRevisionId]
      properties:
        code: { type: string, enum: [stale_base_revision, active_change_exists] }
        currentRevisionId: { type: string }
        activeChangeId: { type: [string, 'null'] }
    CreateLateNotificationEvidence:
      type: object
      required: [changeId, roomId, chatworkMessageId, postedAt, evidence]
      properties:
        changeId: { type: string }
        roomId: { type: string, pattern: '^[0-9]+$' }
        chatworkMessageId: { type: string }
        postedAt: { type: string, format: date-time }
        evidence: { type: string, minLength: 1, description: 変更IDを含む投稿との照合根拠 }
    LateNotificationEvidence:
      type: object
      required: [id, changeId, environmentId, baseRevisionId, changeFailedAt, roomId, chatworkMessageId, postedAt, discoveredAt, evidence, notAppliedReason, retainUntil]
      properties:
        id: { type: string }
        changeId: { type: string }
        notificationId: { type: [string, 'null'] }
        environmentId: { type: string }
        baseRevisionId: { type: string }
        changeFailedAt: { type: string, format: date-time }
        roomId: { type: string }
        chatworkMessageId: { type: string }
        postedAt: { type: string, format: date-time }
        discoveredAt: { type: string, format: date-time }
        discoveredByUserId: { type: [string, 'null'], description: 自動検知時はnull }
        evidence: { type: string }
        notAppliedReason: { type: string, const: change_already_failed }
        retainUntil: { type: string, format: date-time, description: 発見から1年 }
    AppAlert:
      type: object
      required: [id, changeId, message, createdAt]
      properties:
        id: { type: string }
        changeId: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
